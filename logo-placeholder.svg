<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 원 -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#2ECC71" stroke-width="4"/>

  <!-- 재활용 심볼 (순환 화살표) -->
  <g transform="translate(100, 70)">
    <!-- 첫 번째 화살표 -->
    <path d="M -20,-15 L -10,-25 L 0,-15 L -5,-15 L -5,0 L -15,0 L -15,-15 Z"
          fill="#2ECC71" transform="rotate(0)"/>
    <!-- 두 번째 화살표 -->
    <path d="M -20,-15 L -10,-25 L 0,-15 L -5,-15 L -5,0 L -15,0 L -15,-15 Z"
          fill="#2ECC71" transform="rotate(120)"/>
    <!-- 세 번째 화살표 -->
    <path d="M -20,-15 L -10,-25 L 0,-15 L -5,-15 L -5,0 L -15,0 L -15,-15 Z"
          fill="#2ECC71" transform="rotate(240)"/>
  </g>

  <!-- 중앙 재활용 심볼 -->
  <circle cx="100" cy="70" r="12" fill="#2E7D32"/>

  <!-- 사람 실루엣 3명 (복지 상징) -->
  <g transform="translate(100, 140)">
    <!-- 왼쪽 사람 -->
    <circle cx="-25" cy="-10" r="6" fill="#2C3E50"/>
    <path d="M -25,-3 L -30,10 L -20,10 Z" fill="#2C3E50"/>

    <!-- 가운데 사람 (크게) -->
    <circle cx="0" cy="-12" r="7" fill="#2E7D32"/>
    <path d="M 0,-4 L -6,12 L 6,12 Z" fill="#2E7D32"/>

    <!-- 오른쪽 사람 -->
    <circle cx="25" cy="-10" r="6" fill="#2C3E50"/>
    <path d="M 25,-3 L 20,10 L 30,10 Z" fill="#2C3E50"/>
  </g>

  <!-- 연결선 (환경-복지 연결) -->
  <path d="M 100,85 L 100,115" stroke="#2ECC71" stroke-width="3" stroke-dasharray="2,2"/>

  <!-- 하단 텍스트 -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="12"
        fill="#2E7D32" text-anchor="middle" font-weight="bold">
    환경-복지 연결
  </text>

  <!-- 상단 작은 텍스트 -->
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="10"
        fill="#2ECC71" text-anchor="middle" font-weight="bold">
    ECO-WELFARE
  </text>
</svg>
